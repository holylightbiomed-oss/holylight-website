<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Holy Light Biomed Logo</title>
  <desc id="desc">A red outer ring, yellow middle ring, white center, green arched Holy Light Biomed text, and green Rod of Asclepius.</desc>
  <defs>
    <path id="textArc" d="M 310 555 A 290 290 0 0 1 890 555"/>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>

  <circle cx="600" cy="600" r="535" fill="#f20d18"/>
  <circle cx="600" cy="600" r="430" fill="#ffe000"/>
  <circle cx="600" cy="600" r="335" fill="#ffffff"/>

  <text fill="#0b7f36"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="700"
        letter-spacing="0.5">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">Holy Light Biomed</textPath>
  </text>

  <line x1="600" y1="455" x2="600" y2="885"
        stroke="#0b7f36" stroke-width="42" stroke-linecap="round"/>

  <path d="M 680 510
           C 640 455, 545 455, 505 515
           C 465 575, 495 635, 575 650
           C 670 668, 705 720, 660 770
           C 625 810, 565 810, 535 850"
        fill="none"
        stroke="#0b7f36"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M 674 496
           C 708 477, 750 487, 764 518
           C 773 540, 751 559, 724 557
           C 697 555, 678 535, 674 496 Z"
        fill="#0b7f36"/>

  <circle cx="735" cy="520" r="9" fill="#ffffff"/>

  <path d="M 762 531 L 790 531 L 808 520
           M 790 531 L 808 542"
        fill="none" stroke="#0b7f36" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
